<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <title>Tez Asistanı</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 10px; background-color: #f3f2f1; }
        .container { display: flex; flex-direction: column; height: 95vh; }
        /* Giriş Ekranı */
        #login-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; text-align: center; }
        #api-key-input { width: 90%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .btn-primary { background-color: #0078d4; color: white; border: none; padding: 8px 16px; cursor: pointer; border-radius: 4px; width: 95%; font-weight: bold; margin-bottom: 10px;}
        .btn-primary:hover { background-color: #106ebe; }
        .link-ai { color: #0078d4; text-decoration: none; font-size: 0.9em; margin-bottom: 20px;}
        /* Sohbet Ekranı */
        #chat-screen { display: none; flex-direction: column; height: 100%; }
        #chat-messages { flex-grow: 1; overflow-y: auto; background: white; padding: 10px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 10px; }
        .message { margin-bottom: 10px; padding: 8px; border-radius: 4px; font-size: 0.9em; }
        .user-message { background-color: #e1dfdd; text-align: right; }
        .ai-message { background-color: #dff6dd; text-align: left; }
        .system-message { background-color: #fff4ce; text-align: center; font-style: italic; font-size: 0.8em; }
        .error-message { background-color: #fde7e9; color: #a80000; }
        .input-area { display: flex; gap: 5px; }
        #chat-input { flex-grow: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; resize: none; height: 40px;}
        #btn-send { background-color: #0078d4; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 4px; }
        #btn-logout { background-color: transparent; color: #a80000; border: none; text-decoration: underline; cursor: pointer; text-align: right; font-size: 0.8em; margin-bottom: 5px;}
    </style>
</head>
<body>
    <div class="container">
        <div id="login-screen">
            <h3>Tez Asistanı</h3>
            <p style="font-size: 0.9em; color: #666;">Başlamak için kendi Google AI Studio anahtarınızı bağlayın.</p>
            <input type="password" id="api-key-input" placeholder="AIzaSy..." />
            <button id="btn-login" class="btn-primary">Sisteme Bağlan</button>
            <a href="https://aistudio.google.com/app/apikey" target="_blank" class="link-ai">Ücretsiz API Anahtarı Al</a>
        </div>

        <div id="chat-screen">
            <button id="btn-logout">Oturumu ve Anahtarı Sil</button>
            <div id="chat-messages"></div>
<textarea id="myTextArea" placeholder="Word'den çekilen metin buraya gelecek..." readonly style="width:100%; height:80px; margin-bottom:10px;"></textarea>
            <div class="input-area">
                <textarea id="chat-input" placeholder="Seçili metin için talimatınız..."></textarea>
                <button id="btn-send">İlet</button>
            </div>
        </div>
    </div>
    <script src="taskpane.js"></script>
</body>
</html>
